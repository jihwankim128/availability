external-api.connect-timeout=1s
external-api.read-timeout=1s
external-api.circuit-breaker.enabled=true
external-api.circuit-breaker.sliding-window-size=20
external-api.circuit-breaker.minimum-number-of-calls=20
external-api.circuit-breaker.failure-rate-threshold=50
external-api.circuit-breaker.wait-duration-in-open-state=10s
external-api.circuit-breaker.permitted-calls-in-half-open-state=5
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
